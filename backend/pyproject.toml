[project]
name = "softgraph-backend"
version = "0.1.0"
description = "SoftGraph backend with durable ingestion and reference graph/fuzzy engines"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1.0",
  "pydantic>=2.12,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-multipart>=0.0.20,<1.0",
  "pypdf>=6.0,<7.0",
  "openpyxl==3.1.5",
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]
training = ["numpy==1.26.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
